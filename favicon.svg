<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background circle -->
  <circle cx="50" cy="50" r="50" fill="#07050a"/>

  <!-- Subtle red glow ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#cc0000" stroke-width="1.5" opacity="0.4"/>

  <!-- Spider legs - LEFT (drawn first, behind body) -->
  <!-- Top-left leg -->
  <polyline points="45,37 28,20 18,14" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upper-mid-left leg -->
  <polyline points="43,44 20,38 10,36" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower-mid-left leg -->
  <polyline points="43,52 20,56 10,62" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-left leg -->
  <polyline points="44,59 30,72 22,82" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spider legs - RIGHT -->
  <!-- Top-right leg -->
  <polyline points="55,37 72,20 82,14" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upper-mid-right leg -->
  <polyline points="57,44 80,38 90,36" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower-mid-right leg -->
  <polyline points="57,52 80,56 90,62" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-right leg -->
  <polyline points="56,59 70,72 78,82" stroke="#cc0000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Spider head (top oval) -->
  <ellipse cx="50" cy="33" rx="10" ry="9" fill="#cc0000"/>

  <!-- Narrow connector -->
  <rect x="46.5" y="41" width="7" height="7" rx="2" fill="#cc0000"/>

  <!-- Spider abdomen (larger bottom oval) -->
  <ellipse cx="50" cy="62" rx="14" ry="17" fill="#cc0000"/>

  <!-- Eyes (white dots on head) -->
  <ellipse cx="46" cy="31" rx="2.8" ry="2.2" fill="white" opacity="0.9"/>
  <ellipse cx="54" cy="31" rx="2.8" ry="2.2" fill="white" opacity="0.9"/>

  <!-- Subtle highlight on abdomen -->
  <ellipse cx="46" cy="56" rx="4" ry="3" fill="white" opacity="0.06"/>
</svg>
