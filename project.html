<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects | Alan Biju</title>
<link rel="icon" href="icon.webp" type="image/x-icon">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07050a;--red:#cc0000;--red2:#ff2828;--text:#f0e8ea;--muted:#9a8a8e;--border:rgba(204,0,0,0.18);--card:rgba(16,8,10,0.92);--r:10px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(200,0,0,0.055) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;z-index:0}
#progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--red),var(--red2),#ff8080);z-index:999;width:0;transition:width .08s linear}
nav{position:fixed;top:0;width:100%;z-index:100;padding:0 48px;height:68px;display:flex;align-items:center;justify-content:space-between;background:rgba(7,3,8,.88);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.nav-logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.nav-logo-icon{width:34px;height:34px}
.nav-logo-text{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:900;color:var(--text);letter-spacing:-.5px}
.nav-logo-text em{color:var(--red);font-style:normal}
.nav-links{display:flex;gap:2px;list-style:none}
.nav-links a{color:rgba(240,232,234,.6);text-decoration:none;padding:7px 13px;border-radius:6px;font-size:13px;font-weight:500;transition:all .2s}
.nav-links a:hover,.nav-links a.act{color:var(--text);background:rgba(204,0,0,.1)}
.nav-cta{background:var(--red)!important;color:#fff!important;font-weight:700!important}
.nav-cta:hover{background:var(--red2)!important;box-shadow:0 0 22px rgba(204,0,0,.5)!important}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
.web-deco{position:fixed;pointer-events:none;opacity:.07;z-index:1}
.page-hero{padding:110px 48px 40px;text-align:center;position:relative;z-index:2}
.ph-label{font-size:11px;font-weight:700;letter-spacing:3px;color:var(--red);text-transform:uppercase;margin-bottom:12px}
.ph-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(40px,6vw,72px);font-weight:900;letter-spacing:-2px;background:linear-gradient(90deg,#fff 0%,rgba(240,180,180,.9) 60%,rgba(204,0,0,.8) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.ph-sub{font-size:15px;color:var(--muted);max-width:480px;margin:0 auto;line-height:1.7}
/* Filter */
.filter-bar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:32px 48px 48px;position:relative;z-index:2}
.fb{padding:8px 20px;border-radius:5px;border:1px solid var(--border);background:rgba(204,0,0,.05);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;transition:all .22s;font-family:inherit;text-transform:uppercase;letter-spacing:.5px}
.fb.act,.fb:hover{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 16px rgba(204,0,0,.3)}
/* Grid */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;max-width:1160px;margin:0 auto;padding:0 48px 100px;position:relative;z-index:2}
.pc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:all .4s cubic-bezier(.25,.8,.25,1);position:relative;opacity:0;transform:translateY(28px);cursor:pointer}
.pc.vis{opacity:1;transform:translateY(0)}
.pc::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--red),var(--red2));transform:scaleX(0);transform-origin:left;transition:transform .35s}
.pc:hover{border-color:rgba(204,0,0,.42);transform:translateY(-10px) scale(1.012);box-shadow:0 22px 55px rgba(0,0,0,.55),0 0 20px rgba(204,0,0,.08)}
.pc:hover::after{transform:scaleX(1)}
.pc-top{height:7px}
.pc-top.dragon{background:linear-gradient(90deg,#ef4444,#f97316,#eab308)}
.pc-top.soccer{background:linear-gradient(90deg,#4ade80,#06b6d4)}
.pc-top.red{background:linear-gradient(90deg,var(--red),var(--red2))}
.pc-top.cyan{background:linear-gradient(90deg,#06b6d4,#0ea5e9)}
.pc-top.green{background:linear-gradient(90deg,#4ade80,#22c55e)}
.pc-top.pink{background:linear-gradient(90deg,#f472b6,#ec4899)}
.pc-body{padding:24px}
.pc-status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:12px}
.ps-live{background:rgba(74,222,128,.1);color:#4ade80;border:1px solid rgba(74,222,128,.22)}
.ps-dev{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.22)}
.ps-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.pc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ptag{padding:3px 9px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ptag-r{background:rgba(204,0,0,.14);color:#ff8a80;border:1px solid rgba(204,0,0,.22)}
.ptag-b{background:rgba(26,26,110,.3);color:#90b4f9;border:1px solid rgba(26,26,110,.4)}
.ptag-g{background:rgba(30,80,30,.3);color:#90d490;border:1px solid rgba(30,80,30,.4)}
.ptag-o{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.22)}
.ptag-m{background:rgba(244,114,182,.1);color:#f9a8d4;border:1px solid rgba(244,114,182,.2)}
.pc-ic{font-size:36px;margin-bottom:12px;display:block}
.pc-t{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:900;color:var(--text);margin-bottom:8px;letter-spacing:-.3px}
.pc-d{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:18px}
.pc-tech{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tpill{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.pc-link{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:7px;font-size:12px;font-weight:700;text-decoration:none;transition:all .22s;justify-content:center;background:var(--red);color:#fff;cursor:pointer;border:none;font-family:inherit;width:100%}
.pc-link:hover{background:var(--red2);box-shadow:0 6px 18px rgba(204,0,0,.4);transform:translateY(-2px)}
.pc-link.disabled{background:rgba(200,0,0,.07);border:1px solid rgba(200,0,0,.15);color:rgba(200,130,130,.5);cursor:default;pointer-events:none}
.pc-arr{position:absolute;top:18px;right:18px;width:28px;height:28px;border-radius:5px;background:rgba(204,0,0,.08);border:1px solid rgba(204,0,0,.16);display:flex;align-items:center;justify-content:center;color:var(--red);font-size:11px;transition:all .3s}
.pc:hover .pc-arr{background:var(--red);color:#fff;border-color:transparent;transform:rotate(-45deg)}
/* Panel */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:800;opacity:0;pointer-events:none;transition:opacity .4s;backdrop-filter:blur(5px)}
#overlay.show{opacity:1;pointer-events:all}
#panel{position:fixed;right:0;top:0;width:min(500px,90vw);height:100%;background:rgba(10,4,10,.98);border-left:1px solid rgba(204,0,0,.28);z-index:900;transform:translateX(100%);transition:transform .5s cubic-bezier(.76,0,.24,1);overflow-y:auto;display:flex;flex-direction:column}
#panel.open{transform:translateX(0)}
.ph2{padding:26px 26px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,4,10,.95);backdrop-filter:blur(12px);z-index:5}
.ph2-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:6px;background:rgba(204,0,0,.09);border:1px solid rgba(204,0,0,.18);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s}
.ph2-close:hover{background:var(--red);color:#fff;border-color:transparent}
.ph2-ic{font-size:40px;margin-bottom:9px}
.ph2-t{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:900;color:var(--text);letter-spacing:-.4px;margin-bottom:5px}
.ph2-st{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.pb{padding:22px 26px 40px}
.pb-lbl{font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:2px;margin-top:22px;margin-bottom:9px}
.pb-lbl:first-child{margin-top:0}
.pb-text{font-size:13px;color:var(--muted);line-height:1.85}
.pb-feat{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-bottom:1px solid rgba(204,0,0,.08);font-size:13px;color:var(--muted)}
.pb-fd{color:var(--red);font-size:10px;margin-top:4px;flex-shrink:0}
.pb-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.pb-chip{padding:5px 11px;background:rgba(204,0,0,.1);border:1px solid rgba(204,0,0,.18);border-radius:5px;font-size:11px;font-weight:500;color:#ff8080}
.pb-links{display:flex;gap:9px;margin-top:22px}
.pbl{display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:7px;font-size:12px;font-weight:700;text-decoration:none;transition:all .22s;cursor:pointer;border:none;font-family:inherit}
.pbl-p{background:var(--red);color:#fff}
.pbl-p:hover{background:var(--red2);box-shadow:0 7px 20px rgba(204,0,0,.4);transform:translateY(-2px)}
.pbl-s{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--muted)}
.pbl-s:hover{color:var(--text);border-color:rgba(204,0,0,.3)}
footer{padding:44px 48px;border-top:1px solid var(--border);position:relative;z-index:2}
.fi{max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.fb-logo{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:900;color:var(--text)}
.fb-logo em{color:var(--red);font-style:normal}
.copy{font-size:13px;color:rgba(148,163,184,.4)}
.socials{display:flex;gap:9px}
.socials a{width:40px;height:40px;border-radius:7px;background:rgba(204,0,0,.07);border:1px solid var(--border);color:var(--muted);font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;transition:all .3s}
.socials a:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-3px) scale(1.08)}
@media(max-width:768px){nav{padding:0 20px}.nav-links{display:none;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:rgba(7,3,8,.98);padding:16px;gap:4px;border-bottom:1px solid var(--border)}.nav-links.open{display:flex}.hamburger{display:block}.page-hero,.filter-bar{padding-left:20px;padding-right:20px}.proj-grid{padding-left:20px;padding-right:20px;grid-template-columns:1fr}footer{padding:32px 20px}.fi{flex-direction:column}}
</style>
</head>
<body>
<div id="progress"></div>
<svg class="web-deco" style="top:0;right:0;width:240px;height:240px" viewBox="0 0 280 280"><g stroke="#cc0000" fill="none"><line x1="280" y1="0" x2="0" y2="0" stroke-width=".5" opacity=".5"/><line x1="280" y1="0" x2="0" y2="56" stroke-width=".5" opacity=".35"/><line x1="280" y1="0" x2="56" y2="0" stroke-width=".5" opacity=".5"/><polyline points="280,0 240,32 200,0 160,32 120,0 80,32 40,0 0,32" stroke-width=".6" opacity=".35"/><polyline points="280,0 224,72 168,0 112,72 56,0 0,72" stroke-width=".5" opacity=".25"/></g></svg>
<nav>
  <a href="index.html" class="nav-logo">
    <svg class="nav-logo-icon" viewBox="0 0 34 34" fill="none"><circle cx="17" cy="17" r="15.5" stroke="#cc0000" stroke-width="1" opacity=".5"/><line x1="17" y1="1.5" x2="17" y2="32.5" stroke="#cc0000" stroke-width=".7" opacity=".45"/><line x1="1.5" y1="17" x2="32.5" y2="17" stroke="#cc0000" stroke-width=".7" opacity=".45"/><line x1="6" y1="6" x2="28" y2="28" stroke="#cc0000" stroke-width=".7" opacity=".45"/><line x1="28" y1="6" x2="6" y2="28" stroke="#cc0000" stroke-width=".7" opacity=".45"/><circle cx="17" cy="17" r="6" stroke="#cc0000" stroke-width=".7" opacity=".55"/><circle cx="17" cy="17" r="11" stroke="#cc0000" stroke-width=".6" opacity=".35"/><circle cx="17" cy="17" r="3" fill="#cc0000"/></svg>
    <div class="nav-logo-text">ALAN<em>.</em></div>
  </a>

  <button class="hamburger" onclick="toggleNav()">&#9776;</button>
</nav>
<div class="page-hero">
  <p class="ph-label">What I've been building</p>
  <h1 class="ph-title">Projects</h1>
  <p class="ph-sub">From AI systems and real-time apps to games in development. Click any card for full details.</p>
</div>
<div class="filter-bar">
  <button class="fb act" data-f="all">All</button>
  <button class="fb" data-f="ai">AI / ML</button>
  <button class="fb" data-f="web">Web</button>
  <button class="fb" data-f="game">Games</button>
</div>
<div class="proj-grid" id="proj-grid"></div>
<div id="overlay" onclick="closePanel()"></div>
<div id="panel">
  <div class="ph2">
    <button class="ph2-close" onclick="closePanel()"><i class="fas fa-times"></i></button>
    <div class="ph2-ic" id="ph2-ic"></div>
    <div class="ph2-t" id="ph2-t"></div>
    <span class="ph2-st" id="ph2-st"></span>
  </div>
  <div class="pb" id="pb"></div>
</div>

  <div class="fi">
    <div class="fb-logo">ALAN<em>.</em></div>

      <a href="https://www.instagram.com/egoistisagi_/" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
      <a href="https://www.facebook.com/profile.php?id=100012227791569" target="_blank" rel="noopener"><i class="fab fa-facebook"></i></a>
      <a href="https://github.com/Alanbiju433" target="_blank" rel="noopener"><i class="fab fa-github"></i></a>
      <a href="mailto:alanbiju17@gmail.com"><i class="fas fa-envelope"></i></a>
    </div>
    <p class="copy">&#169; 2025 Alan Biju</p>
  </div>
</footer>
<script>
function toggleNav(){document.getElementById('nav-links').classList.toggle('open')}
window.addEventListener('scroll',()=>{const p=(scrollY/(document.documentElement.scrollHeight-innerHeight))*100;document.getElementById('progress').style.width=p+'%'});

const projects=[
  {ic:'🐉',t:'Draygon Aethernova',sd:'Dragon-themed fantasy action game built from scratch.',st:'dev',stTxt:'In Development',cats:'game',top:'dragon',full:'A dragon-themed fantasy action game built entirely from the ground up. Features a deep custom lore world, original character designs, and immersive mechanics.',feats:['Custom lore & worldbuilding','Original character design','Combat & exploration mechanics'],tech:['Game Design','Python / Unity','Lore Writing'],tags:[{t:'Game',c:'ptag-r'},{t:'Fantasy',c:'ptag-o'}],link:null},
  {ic:'⚽',t:'Soccer Buddies',sd:'Social game & future product for football players.',st:'dev',stTxt:'In Development',cats:'game web',top:'soccer',full:'A social game and future product for football lovers. Find teammates, organise matches, track stats, and compete in community leagues.',feats:['Geolocation player finder','Match organisation','Community leaderboards'],tech:['Full-Stack','Geolocation','Real-Time'],tags:[{t:'Game',c:'ptag-g'},{t:'Social',c:'ptag-b'}],link:null},
  {ic:'♻️',t:'AI Waste Management',sd:'Real-time waste classification via computer vision.',st:'dev',stTxt:'In Progress',cats:'ai',top:'green',full:'Intelligent waste classification system powered by deep learning — identifies waste types in real-time for smarter recycling.',feats:['Real-time CV classification','CNN model','Environmental impact'],tech:['Python','TensorFlow','OpenCV'],tags:[{t:'AI',c:'ptag-r'},{t:'CV',c:'ptag-b'}],link:null},
  {ic:'💬',t:'Realtime Chat App',sd:'Full-stack messaging app with Socket.io.',st:'live',stTxt:'Live',cats:'web',top:'cyan',full:'Real-time messaging with instant delivery, multi-room support, and responsive UI on WebSocket / Socket.io.',feats:['Instant message delivery','Multiple rooms','Responsive UI'],tech:['Node.js','Socket.io','Express'],tags:[{t:'Web',c:'ptag-b'},{t:'Real-Time',c:'ptag-g'}],link:'https://github.com/Alanbiju433/realtime-chat-app'},
  {ic:'🖐️',t:'Palm Recognition ML',sd:'Biometric palm identification via machine learning.',st:'live',stTxt:'Complete',cats:'ai',top:'red',full:'Biometric palm recognition that identifies individuals from palm geometry using ML — secure access and identity applications.',feats:['Palm geometry extraction','ML matching','Real-time processing'],tech:['Python','OpenCV','scikit-learn'],tags:[{t:'ML',c:'ptag-r'},{t:'AI',c:'ptag-r'}],link:'https://github.com/Alanbiju433/palm-recognition-ml'},
  {ic:'🎂',t:'Birthday Event Site',sd:'Personalised animated event website.',st:'live',stTxt:'Live',cats:'web',top:'pink',full:'Personalised event website with smooth animations and warm design — emotionally resonant web experience beyond functional interfaces.',feats:['CSS animations','Responsive design','Creative storytelling'],tech:['HTML5','CSS3','JavaScript'],tags:[{t:'Web',c:'ptag-b'},{t:'Creative',c:'ptag-m'}],link:'https://alanbiju433.github.io/birthday-event-site/'},
];

const grid=document.getElementById('proj-grid');
const cards=[];
projects.forEach((p,i)=>{
  const c=document.createElement('div');
  c.className='pc';
  c.dataset.cats=p.cats;
  c.innerHTML=`<div class="pc-arr"><i class="fas fa-arrow-right"></i></div><div class="pc-top ${p.top}"></div><div class="pc-body"><div class="pc-status ${p.st==='live'?'ps-live':'ps-dev'}"><span class="ps-dot"></span>${p.stTxt}</div><div class="pc-tags">${p.tags.map(t=>`<span class="ptag ${t.c}">${t.t}</span>`).join('')}</div><div class="pc-ic">${p.ic}</div><div class="pc-t">${p.t}</div><p class="pc-d">${p.sd}</p><div class="pc-tech">${p.tech.map(t=>`<span class="tpill">${t}</span>`).join('')}</div>${p.link?`<a href="${p.link}" target="_blank" class="pc-link"><i class="fab fa-github"></i> GitHub</a>`:`<button class="pc-link disabled"><i class="fas fa-lock"></i> In Development</button>`}</div>`;
  c.addEventListener('click',()=>openPanel(p));
  grid.appendChild(c);
  cards.push(c);
});

const obs=new IntersectionObserver(es=>es.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('vis'),i*80);obs.unobserve(e.target)}}),{threshold:.08});
cards.forEach(c=>obs.observe(c));

document.querySelectorAll('.fb').forEach(btn=>{
  btn.addEventListener('click',function(){
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('act'));
    this.classList.add('act');
    const f=this.dataset.f;
    cards.forEach(c=>{
      const cats=(c.dataset.cats||'').split(' ');
      c.style.display=(f==='all'||cats.includes(f))?'':'none';
    });
  });
});

function openPanel(p){
  document.getElementById('ph2-ic').textContent=p.ic;
  document.getElementById('ph2-t').textContent=p.t;
  const st=document.getElementById('ph2-st');
  st.textContent=p.stTxt;st.className='ph2-st '+(p.st==='live'?'ps-live':'ps-dev');
  document.getElementById('pb').innerHTML=`<p class="pb-lbl">About</p><p class="pb-text">${p.full}</p><p class="pb-lbl">Key Features</p>${p.feats.map(f=>`<div class="pb-feat"><span class="pb-fd">▶</span>${f}</div>`).join('')}<p class="pb-lbl">Tech Stack</p><div class="pb-chips">${p.tech.map(t=>`<span class="pb-chip">${t}</span>`).join('')}</div><div class="pb-links">${p.link?`<a href="${p.link}" target="_blank" class="pbl pbl-p"><i class="fab fa-github"></i> GitHub</a>`:`<span class="pbl pbl-s" style="opacity:.5;cursor:default"><i class="fas fa-lock"></i> Private</span>`}<a href="#" onclick="closePanel();return false" class="pbl pbl-s"><i class="fas fa-times"></i> Close</a></div>`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePanel(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('panel').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
</script>
</body>
